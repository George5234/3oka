<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعكة قلبي 🔥 سنية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=El+Messiri:wght@700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'El Messiri', sans-serif;
            background: linear-gradient(45deg, #0a0015, #330011);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #heartCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .love-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 30px 20px;
        }

        /* القلب الساخن 🔥 */
        .big-heart {
            font-size: clamp(100px, 20vw, 180px);
            animation: heartbeatCrazy 0.6s infinite alternate, shake 0.8s infinite;
            filter: drop-shadow(0 0 40px #ff0066) drop-shadow(0 0 80px #ff3399);
            cursor: pointer;
            transition: all 0.2s;
        }
        .big-heart:hover {
            transform: scale(1.25) rotate(8deg);
            filter: drop-shadow(0 0 60px #ff0066) drop-shadow(0 0 120px #ff00aa);
        }

        @keyframes heartbeatCrazy {
            0% { transform: scale(1); }
            100% { transform: scale(1.25); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-5deg); }
            75% { transform: translateX(8px) rotate(5deg); }
        }

        /* اليد اللي بتشير */
        .pointing-hand {
            position: absolute;
            font-size: 60px;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            animation: pointAnim 2.5s infinite;
            z-index: 20;
            filter: drop-shadow(0 0 15px #ffff00);
        }
        @keyframes pointAnim {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.9; }
            50% { transform: translateX(-50%) translateY(-25px); opacity: 1; }
        }

        #typingTitle {
            color: #ffccdd;
            font-size: clamp(2.2rem, 9vw, 4.5rem);
            font-weight: 900;
            text-shadow: 0 0 30px #ff0066, 0 0 60px #ff3399;
            animation: blinkBorder 0.8s infinite;
        }

        .akka-name {
            font-size: clamp(2.8rem, 11vw, 5.5rem);
            background: linear-gradient(45deg, #ff0066, #ff00aa, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 1.8s linear infinite;
            cursor: pointer;
        }

        .message-bubble {
            background: rgba(255, 20, 80, 0.25);
            border: 3px solid #ff3399;
            padding: 22px 40px;
            font-size: clamp(1.3rem, 4.5vw, 2.2rem);
            color: #fff0f5;
            box-shadow: 0 0 40px rgba(255, 50, 100, 0.6);
        }

        .music-control {
            background: rgba(255, 51, 102, 0.3);
            width: 80px; height: 80px;
            font-size: 2.5rem;
            box-shadow: 0 0 30px #ff0066;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <div class="love-container">
        <div style="position: relative;">
            <div class="pointing-hand" id="pointHand">👆</div>
            <div class="big-heart" id="mainHeart">❤️‍🔥</div>
        </div>

        <div id="typingTitle"></div>
        <div class="akka-name" id="akkaText">يا عكة قلبي</div>

        <div class="message-bubble">🔥 بحبك يا أحلى عكة ساخنة في الدنيا 🔥</div>
        <div class="message-bubble" style="animation-delay: 0.4s;">💋 عايز أذوبك دلوقتي يا سنية 😈</div>

        <button class="music-control" id="musicBtn">🎵</button>
    </div>

    <script>
        // Canvas Particles (أكثر كثافة وحرارة)
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        const emojis = ['❤️', '💋', '🔥', '💖', '💦', '🌹', '😈', '💕'];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 35 + 18;
                this.speedY = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1.5 - 0.75;
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
                this.opacity = Math.random() * 0.7 + 0.5;
                this.rotation = Math.random() * 360;
                this.rotSpeed = Math.random() * 3 - 1.5;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y > height + 100) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle()); // زيادة العدد

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Typing Effect
        const titles = ["يا سنية يا نار 🔥", "أحلى عكة ساخنة 😈", "بحبك يا مزة", "تعالي أدلعك دلوقتي 💋"];
        let titleIndex = 0, charIndex = 0, isDeleting = false;
        const typingElement = document.getElementById('typingTitle');

        function typeEffect() {
            const current = titles[titleIndex];
            if (!isDeleting) {
                typingElement.textContent = current.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === current.length) { isDeleting = true; setTimeout(typeEffect, 1800); return; }
            } else {
                typingElement.textContent = current.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) { isDeleting = false; titleIndex = (titleIndex + 1) % titles.length; }
            }
            setTimeout(typeEffect, isDeleting ? 40 : 80);
        }
        typeEffect();

        // Music
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let playing = false;
        musicBtn.addEventListener('click', () => {
            if (playing) {
                bgMusic.pause(); musicBtn.textContent = '🎵';
            } else {
                bgMusic.play(); musicBtn.textContent = '🔊';
            }
            playing = !playing;
        });

        // Secret Message + Strong Shake
        const mainHeart = document.getElementById('mainHeart');
        mainHeart.addEventListener('click', (e) => {
            document.body.style.animation = 'shake 0.4s';
            setTimeout(() => document.body.style.animation = '', 500);

            // Explosive hearts
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const p = new Particle();
                    p.x = e.clientX;
                    p.y = e.clientY - 50;
                    p.speedY = -Math.random() * 8 - 3;
                    p.speedX = Math.random() * 8 - 4;
                    particles.push(p);
                    setTimeout(() => particles.splice(particles.indexOf(p), 1), 2500);
                }, i * 30);
            }
        });

        // Pointing Hand Animation
        const hand = document.getElementById('pointHand');
        setInterval(() => {
            hand.style.opacity = '1';
            setTimeout(() => hand.style.opacity = '0.3', 900);
        }, 2500);

        // Change nicknames
        const akkaText = document.getElementById('akkaText');
        const names = ['يا عكة قلبي 🔥', 'يا نار يا سنية 😈', 'عكتي الساخنة 💋', 'يا مزة يا عكة', 'سنية اللي بتجنني'];
        let i = 0;
        akkaText.addEventListener('click', () => {
            i = (i + 1) % names.length;
            akkaText.textContent = names[i];
        });

        console.log('🔥 تم تعديل الصفحة بجنون لعكتك سنية 🔥');
    </script>
</body>
</html>
