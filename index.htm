<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعكتي سنية ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a0033, #330022);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffe6f0;
            position: relative;
        }

        #heartCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .love-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 680px;
            text-align: center;
            padding: 40px 20px;
        }

        /* القلب الأنيق */
        .big-heart {
            font-size: clamp(110px, 22vw, 190px);
            animation: heartbeatSoft 2.2s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 35px #ff3366) drop-shadow(0 0 70px #ff6699);
            cursor: pointer;
            transition: transform 0.4s;
        }
        .big-heart:hover {
            transform: scale(1.15);
        }

        @keyframes heartbeatSoft {
            from { transform: scale(1); }
            to { transform: scale(1.18); }
        }

        /* اليد الدالة */
        .pointing-hand {
            position: absolute;
            font-size: 55px;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            animation: pointAnim 3s infinite ease-in-out;
            z-index: 15;
            opacity: 0.85;
        }
        @keyframes pointAnim {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-20px); }
        }

        #typingTitle {
            font-size: clamp(2.1rem, 7.5vw, 3.8rem);
            font-weight: 700;
            margin: 20px 0;
            text-shadow: 0 0 25px #ff6699;
            min-height: 1.4em;
        }

        .akka-name {
            font-size: clamp(2.6rem, 9vw, 4.8rem);
            font-weight: 900;
            background: linear-gradient(90deg, #ff6699, #ff99cc, #ff6699);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0;
            cursor: pointer;
        }

        .message-bubble {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 102, 153, 0.4);
            border-radius: 50px;
            padding: 22px 35px;
            font-size: clamp(1.25rem, 4vw, 1.9rem);
            margin: 18px 0;
            box-shadow: 0 0 30px rgba(255, 80, 120, 0.3);
        }

        .music-control {
            margin-top: 30px;
            background: rgba(255, 102, 153, 0.2);
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 2.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <!-- صوت أمبيانس رومانسي (يشتغل تلقائي) -->
    <audio id="bgMusic" loop autoplay>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
    </audio>

    <div class="love-container">
        <div style="position: relative; display: inline-block;">
            <div class="pointing-hand" id="pointHand">👆</div>
            <div class="big-heart" id="mainHeart">❤️‍🔥</div>
        </div>

        <div id="typingTitle"></div>
        <div class="akka-name" id="akkaText">يا عكتي سنية</div>

        <div class="message-bubble">❤️ يا روحي يا سنية، أنتِ أحلى حاجة في حياتي ❤️</div>
        <div class="message-bubble">🥺 آسف يا قلبي... نعاود نعيشو لحظاتنا الحلوة؟</div>

        <button class="music-control" id="musicBtn">🎵</button>
    </div>

    <script>
        // Canvas - أمبيانس ناعم
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        const emojis = ['❤️', '💕', '💖', '🌹', '✨', '💗', '🌸'];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 28 + 16;
                this.speedY = Math.random() * 1.8 + 0.6;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
                this.opacity = Math.random() * 0.65 + 0.45;
                this.rotation = Math.random() * 360;
                this.rotSpeed = Math.random() * 1.2 - 0.6;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y > height + 80) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Typing Effect (تونسي)
        const titles = [
            "مرحبا يا سنية ❤️",
            "يا عكتي الغالية",
            "أنتِ نور عيني",
            "بحبك يا روحي"
        ];
        let titleIndex = 0, charIndex = 0, isDeleting = false;
        const typingElement = document.getElementById('typingTitle');

        function typeEffect() {
            const current = titles[titleIndex];
            if (!isDeleting) {
                typingElement.textContent = current.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === current.length) { isDeleting = true; setTimeout(typeEffect, 2200); return; }
            } else {
                typingElement.textContent = current.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) { isDeleting = false; titleIndex = (titleIndex + 1) % titles.length; }
            }
            setTimeout(typeEffect, isDeleting ? 50 : 90);
        }
        typeEffect();

        // الموسيقى (تلقائي + تحكم)
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        
        // محاولة تشغيل تلقائي
        bgMusic.volume = 0.6;
        bgMusic.play().catch(() => {});

        musicBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                musicBtn.textContent = '🔊';
            } else {
                bgMusic.pause();
                musicBtn.textContent = '🎵';
            }
        });

        // النقر على القلب
        const mainHeart = document.getElementById('mainHeart');
        mainHeart.addEventListener('click', (e) => {
            // انفجار خفيف أنيق
            for (let i = 0; i < 18; i++) {
                setTimeout(() => {
                    const p = new Particle();
                    p.x = e.clientX;
                    p.y = e.clientY - 40;
                    p.speedY = -Math.random() * 6 - 2;
                    p.speedX = Math.random() * 5 - 2.5;
                    particles.push(p);
                    setTimeout(() => particles.splice(particles.indexOf(p),1), 3000);
                }, i * 40);
            }
        });

        // تغيير الألقاب التونسية
        const akkaText = document.getElementById('akkaText');
        const names = [
            "يا عكتي سنية ❤️",
            "يا روحي",
            "يا قلبي",
            "عكتي الغالية",
            "يا سنية يا حلوة"
        ];
        let idx = 0;
        akkaText.addEventListener('click', () => {
            idx = (idx + 1) % names.length;
            akkaText.textContent = names[idx];
        });

        // اليد الدالة
        const hand = document.getElementById('pointHand');
        setInterval(() => hand.style.opacity = hand.style.opacity === '0.3' ? '0.9' : '0.3', 2800);
    </script>
</body>
</html>
